name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Pipeline smoke test
        run: |
          fraud-mlops generate --rows 20000 --fraud-rate 0.02
          fraud-mlops train
          fraud-mlops gate --strict
          fraud-mlops generate --rows 5000 --seed 9 --start 2025-04-01 --drift 1.0 --out data/current.parquet
          fraud-mlops drift
